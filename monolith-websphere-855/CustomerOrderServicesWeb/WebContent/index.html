<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" type="text/css"
	href="theme/layout.css">
	
<title>Electronics and Movie Depot</title>
<meta name="GENERATOR"
	content="Rational® Application Developer for WebSphere® Software">
<!-- Load Dojo from CDN (v1.10.4 for legacy compatibility) -->
<script type="text/javascript"
	djconfig="isDebug: false, parseOnLoad: true" 
	src="https://ajax.googleapis.com/ajax/libs/dojo/1.10.4/dojo/dojo.js"></script>
<script type="text/javascript">
dojo.require("dijit.layout.BorderContainer");
dojo.require("dijit.layout.ContentPane");
dojo.require("dijit.layout.TabContainer");
dojo.require("dojox.layout.ContentPane");
dojo.require("dojo.parser");


dojo.registerModulePath("depot","/CustomerOrderServicesWeb/dojo_depot/depot");
dojo.registerModulePath("product","/CustomerOrderServicesWeb/product");
dojo.registerModulePath("orderHistory","/CustomerOrderServicesWeb/orderHistory");
dojo.registerModulePath("account","/CustomerOrderServicesWeb/account");

// Declare controllers in global scope
var nav;
var accountController;

// Pre-load all controllers
dojo.require("depot.NavigationController");
dojo.require("depot.AccountController");
dojo.require("depot.ProductController");  // Pre-load ProductController

// Initialize controllers after modules are loaded
dojo.ready(function() {
	nav = new depot.NavigationController();
	nav.loadedPage();
	
	accountController = new depot.AccountController();
	accountController.loadAccount();
});

</script>
</head>
<body class="claro">
<div align="center" class="outer">
	<div dojoType="dijit.layout.BorderContainer" id="main" 
	     design="headline" class="layout" align="left">
		<div dojoType="dijit.layout.ContentPane" region="top" baseClass="topArea">
			<div class="banner">Electronic and Movie Depot</div>
		</div>
		<div dojoType="dijit.layout.TabContainer"
		tabposition="top" class="mainArea" id="center" region="center">
			<div dojoType="dojox.layout.ContentPane" 
			title = "Shop" renderStyles="true" id="shop" href="product/product.html"></div>
			<div dojoType="dojox.layout.ContentPane" 
			title = "Cart" renderStyles="true" id="cart" href="cart/cart.html"></div>
			<div dojoType="dojox.layout.ContentPane" 
			title = "Order History" renderStyles="true" id="orderHistory" href="orderHistory/orderHistory.html"></div>
			<div dojoType="dojox.layout.ContentPane" 
			title = "Account" renderStyles="true" id="account" href="account/account.html"></div>
		</div>
</div>
</div>
</body>
</html>
