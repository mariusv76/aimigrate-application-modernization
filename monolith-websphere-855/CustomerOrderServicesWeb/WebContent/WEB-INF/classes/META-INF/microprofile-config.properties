# MicroProfile JWT verification (Entra ID)
# Placeholder values; will be replaced via App Configuration / Key Vault integration
mp.jwt.verify.issuer=https://login.microsoftonline.com/${TENANT_ID}/v2.0
mp.jwt.verify.audiences=api://${CLIENT_ID}
# Public key location or JWKS endpoint for Entra ID (tenant-specific). For multi-tenant adjust strategy.
mp.jwt.verify.publickey.location=https://login.microsoftonline.com/${TENANT_ID}/discovery/v2.0/keys

# Secret cache TTL (seconds) for custom KeyVaultConfigSource (planned)
secret.cache.ttl.seconds=300
