# Default HTTP and HTTPS ports for Open Liberty
default.http.port=9080
default.https.port=9443

# Application name
app.name=CustomerOrderServices

# PostgreSQL Database Configuration
# These will be substituted from environment variables at runtime
DB_HOST=${env.DB_HOST}
DB_PORT=${env.DB_PORT}
DB_NAME=${env.DB_NAME}
DB_USER=${env.DB_USER}
DB_PASSWORD=${env.DB_PASSWORD}

